spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: azurion-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/azurion}
    username: ${DB_USER}
    password: ${DB_PASS}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:20}
      minimum-idle: ${DB_POOL_MIN:5}
      # Fail fast during saturation instead of retaining web threads for 30 s.
      connection-timeout: ${DB_POOL_CONNECTION_TIMEOUT_MS:5000}
      validation-timeout: ${DB_POOL_VALIDATION_TIMEOUT_MS:2000}
      idle-timeout: ${DB_POOL_IDLE_TIMEOUT_MS:600000}
      max-lifetime: ${DB_POOL_MAX_LIFETIME_MS:1800000}
      keepalive-time: ${DB_POOL_KEEPALIVE_MS:300000}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: false
        show_sql: false
        jdbc.time_zone: UTC
        multiTenancy: SCHEMA
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration/public
  jackson:
    default-property-inclusion: non_null
  servlet:
    multipart:
      max-file-size: ${MULTIPART_MAX_FILE_SIZE:8MB}
      max-request-size: ${MULTIPART_MAX_REQUEST_SIZE:10MB}
      file-size-threshold: 0B
  data:
    redis:
      repositories:
        enabled: false
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      password: ${SPRING_DATA_REDIS_PASSWORD:}
      database: ${SPRING_DATA_REDIS_DATABASE:0}
      connect-timeout: ${SPRING_DATA_REDIS_CONNECT_TIMEOUT:2s}
      timeout: ${SPRING_DATA_REDIS_TIMEOUT:2s}

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  tomcat:
    threads:
      max: ${SERVER_TOMCAT_THREADS_MAX:200}
      min-spare: ${SERVER_TOMCAT_THREADS_MIN_SPARE:10}
    max-connections: ${SERVER_TOMCAT_MAX_CONNECTIONS:8192}
    accept-count: ${SERVER_TOMCAT_ACCEPT_COUNT:200}
    connection-timeout: ${SERVER_TOMCAT_CONNECTION_TIMEOUT:5s}
  compression:
    enabled: true
    min-response-size: 2KB
  servlet:
    context-path: /api

spring.lifecycle.timeout-per-shutdown-phase: ${SHUTDOWN_TIMEOUT:30s}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  health:
    redis:
      enabled: ${REDIS_HEALTH_ENABLED:false}
  endpoint:
    health:
      probes:
        enabled: true

security:
  jwt:
    secret: ${JWT_SECRET:}
    issuer: ${JWT_ISSUER:azurion}
    expiration-minutes: ${JWT_EXP_MIN:120}

azurion:
  security:
    email-secret-key: ${AZURION_EMAIL_SECRET_KEY:}
    email-secret-key-previous: ${AZURION_EMAIL_SECRET_KEY_PREVIOUS:}
    crm-secret-key: ${AZURION_CRM_SECRET_KEY:}
    bootstrap-admin:
      username: ${AZURION_BOOTSTRAP_ADMIN_USERNAME:}
      password: ${AZURION_BOOTSTRAP_ADMIN_PASSWORD:}
    sessions:
      store: ${AUTH_SESSION_STORE:memory}
      replacement-token-ttl: ${AUTH_REPLACEMENT_TOKEN_TTL:2m}
      activity-touch-interval: ${AUTH_ACTIVITY_TOUCH_INTERVAL:30s}
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:*,http://127.0.0.1:*}
    rate-limit:
      enabled: ${RATE_LIMIT_ENABLED:true}
      auth-requests-per-minute: ${RATE_LIMIT_AUTH_PER_MINUTE:10}
      public-requests-per-minute: ${RATE_LIMIT_PUBLIC_PER_MINUTE:60}
      max-clients: ${RATE_LIMIT_MAX_CLIENTS:10000}
      distributed-enabled: ${RATE_LIMIT_DISTRIBUTED_ENABLED:true}
      cleanup-delay-millis: ${RATE_LIMIT_CLEANUP_DELAY_MS:60000}
      trusted-proxies: ${RATE_LIMIT_TRUSTED_PROXIES:127.0.0.1,::1}
  email:
    transport:
      connect-timeout-millis: ${SMTP_CONNECT_TIMEOUT_MS:10000}
      read-timeout-millis: ${SMTP_READ_TIMEOUT_MS:20000}
      write-timeout-millis: ${SMTP_WRITE_TIMEOUT_MS:20000}
      tls-protocols: ${SMTP_TLS_PROTOCOLS:TLSv1.2 TLSv1.3}
      check-server-identity: ${SMTP_CHECK_SERVER_IDENTITY:true}
  whatsapp:
    graph-base-url: ${WHATSAPP_GRAPH_BASE_URL:https://graph.facebook.com}
    graph-api-version: ${WHATSAPP_GRAPH_API_VERSION:v25.0}
    connect-timeout-millis: ${WHATSAPP_CONNECT_TIMEOUT_MS:5000}
    read-timeout-millis: ${WHATSAPP_READ_TIMEOUT_MS:15000}
  multitenancy:
    default-schema: public
    tenant-header: X-Tenant-Id
    run-migrations-on-startup: ${TENANT_MIGRATIONS_ON_STARTUP:true}
    public-endpoints: ${PUBLIC_ENDPOINTS:/v1/auth/public/login,/v1/auth/tenant/login,/v1/auth/session/replace,/v1/public/forms/**,/public/forms/**,/v1/public/crm/leads,/public/crm/leads,/v1/public/crm/leads/relay,/public/crm/leads/relay,/v1/public/crm/catalogo/**,/public/crm/catalogo/**,/v1/public/crm/whatsapp/**,/public/crm/whatsapp/**,/v1/public/crm/meta/**,/public/crm/meta/**,/v1/facturador/callback/**,/actuator/health,/files/**}
  crm:
    public-ingress:
      signature-tolerance-seconds: ${CRM_INGRESS_SIGNATURE_TOLERANCE_SECONDS:300}
    reengagement:
      enabled: ${CRM_REENGAGEMENT_ENABLED:true}
      initial-delay-millis: ${CRM_REENGAGEMENT_INITIAL_DELAY_MS:20000}
      poll-delay-millis: ${CRM_REENGAGEMENT_POLL_DELAY_MS:60000}
      cleanup-cron: ${CRM_REENGAGEMENT_CLEANUP_CRON:0 45 3 * * *}
      business-hour-start: ${CRM_REENGAGEMENT_HOUR_START:9}
      business-hour-end: ${CRM_REENGAGEMENT_HOUR_END:20}
      business-days: ${CRM_REENGAGEMENT_DAYS:1,2,3,4,5,6}
  storage:
    public-files:
      root-dir: ${AZURION_PUBLIC_FILES_DIR:${user.dir}/storage/public-files}
    private-files:
      root-dir: ${AZURION_PRIVATE_FILES_DIR:${user.dir}/storage/private-files}
  facturador:
    base-url: ${FACTURADOR_BASE_URL:http://127.0.0.1:8000}
    artifact-base-url: ${FACTURADOR_ARTIFACT_BASE_URL:}
    api-prefix: ${FACTURADOR_API_PREFIX:/api}
    connect-timeout-millis: ${FACTURADOR_CONNECT_TIMEOUT_MS:5000}
    read-timeout-millis: ${FACTURADOR_READ_TIMEOUT_MS:20000}
    wait-processed-enabled: ${FACTURADOR_WAIT_PROCESSED_ENABLED:false}
    wait-processed-timeout-millis: ${FACTURADOR_WAIT_PROCESSED_TIMEOUT_MS:90000}
    wait-processed-poll-interval-millis: ${FACTURADOR_WAIT_PROCESSED_POLL_INTERVAL_MS:1500}
    provisioning-enabled: ${FACTURADOR_PROVISIONING_ENABLED:true}
    client-id: ${FACTURADOR_CLIENT_ID:azurion-core}
    client-secret: ${FACTURADOR_CLIENT_SECRET:}
    signature-version: ${FACTURADOR_SIGNATURE_VERSION:v2}
    allow-legacy-api-key: ${FACTURADOR_ALLOW_LEGACY_API_KEY:false}
    # Compatibilidad temporal. Retirar cuando todos los ambientes usen client-secret.
    default-api-key: ${FACTURADOR_API_KEY:}
    tenant-api-keys: {}
    callback:
      enabled: ${FACTURADOR_CALLBACK_ENABLED:true}
      api-key: ${FACTURADOR_CALLBACK_API_KEY:}
      secret: ${FACTURADOR_CALLBACK_SECRET:}
      header-api-key: ${FACTURADOR_CALLBACK_HEADER_API_KEY:X-API-Key}
      header-signature: ${FACTURADOR_CALLBACK_HEADER_SIGNATURE:X-Signature}
      header-timestamp: ${FACTURADOR_CALLBACK_HEADER_TIMESTAMP:X-Timestamp}
      header-nonce: ${FACTURADOR_CALLBACK_HEADER_NONCE:X-Nonce}
      timestamp-tolerance-seconds: ${FACTURADOR_CALLBACK_TOLERANCE_SECONDS:300}
      nonce-ttl-seconds: ${FACTURADOR_CALLBACK_NONCE_TTL_SECONDS:600}
    outbox:
      enabled: ${FACTURADOR_OUTBOX_ENABLED:true}
      initial-delay-millis: ${FACTURADOR_OUTBOX_INITIAL_DELAY_MS:5000}
      poll-delay-millis: ${FACTURADOR_OUTBOX_POLL_DELAY_MS:2000}
      cleanup-cron: ${FACTURADOR_OUTBOX_CLEANUP_CRON:0 30 3 * * *}
    provisioning:
      initial-delay-millis: ${FACTURADOR_PROVISIONING_INITIAL_DELAY_MS:3000}
      poll-delay-millis: ${FACTURADOR_PROVISIONING_POLL_DELAY_MS:5000}

springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:false}
    path: /v3/api-docs
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:false}
    path: /swagger-ui.html
